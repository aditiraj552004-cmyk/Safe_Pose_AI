<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafePose AI</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<div class="container">

    <header>
        <h1>🩺 SafePose AI</h1>
        <p>AI Powered Real-Time Fall Detection System</p>
    </header>

    <div class="cards">

        <div class="card">
            <h3>🟢 System</h3>
            <h2>Running</h2>
        </div>

        <div class="card">
            <h3>📷 Camera</h3>
            <h2>Connected</h2>
        </div>

        <div class="card">
            <h3>🤖 AI Model</h3>
            <h2>Active</h2>
        </div>

        <div class="card">
            <h3>🎯 Prediction</h3>
            <h2 id="prediction">Loading...</h2>
        </div>

    </div>

    <div class="video-section">

        <img src="{{ url_for('video_feed') }}">

    </div>

    <div class="confidence-box">

        <h2>Confidence</h2>

        <div class="progress">

            <div class="progress-bar" id="progressBar"></div>

        </div>

        <h3 id="confidence">0%</h3>

    </div>

    <div class="graph-box">

        <canvas id="confidenceChart"></canvas>

    </div>

    <div class="history">

        <h2>📋 Fall History</h2>

        <table>

            <thead>

            <tr>
                <th>Time</th>
                <th>Confidence</th>
                <th>Status</th>
            </tr>

            </thead>

            <tbody id="historyBody">

            </tbody>

        </table>

    </div>

</div>

<div class="popup" id="popup">

    🚨 FALL DETECTED 🚨

</div>

<script src="{{ url_for('static', filename='js/app.js') }}"></script>

<script src="{{ url_for('static', filename='js/alarm.js') }}"></script>

</body>
</html>
